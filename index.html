<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUE 稼働モニター｜AI会社リアルタイム監視</title>
<style>
  :root{
    --bg:#0e141b; --bg2:#131c26; --panel:#19222e; --panel2:#1f2b39;
    --line:#2a3a4a; --text:#e8eef4; --sub:#8ba0b4; --dim:#5d7185;
    --green:#40916c; --green-l:#74c69d; --amber:#f6c453; --red:#ef6f6c; --blue:#5aa9e6;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #1b2a25 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 0%, #1a2436 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:22px 22px 60px;}

  /* ── Header ───────────────────────────────────────────── */
  header.top{
    display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px;
    padding:18px 22px;border:1px solid var(--line);border-radius:18px;
    background:linear-gradient(135deg,var(--panel),var(--bg2));box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .logo{
    width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--green),#2d6a4f);font-size:24px;
    box-shadow:0 0 0 1px #ffffff15, inset 0 0 12px #ffffff20;
  }
  .brand h1{font-size:19px;margin:0;letter-spacing:.5px;}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--sub);}
  .clock{margin-left:auto;text-align:right;}
  .clock .time{font-family:"Consolas","Courier New",monospace;font-size:30px;font-weight:700;letter-spacing:1px;line-height:1;}
  .clock .date{font-size:12px;color:var(--sub);margin-top:4px;}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--green-l);margin-top:6px;}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--green-l);box-shadow:0 0 0 0 var(--green-l);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #74c69d88}70%{box-shadow:0 0 0 7px #74c69d00}100%{box-shadow:0 0 0 0 #74c69d00}}

  /* ── Summary chips ─────────────────────────────────────── */
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 6px;}
  .chip{
    display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);min-width:120px;
  }
  .chip .n{font-size:22px;font-weight:700;font-family:"Consolas",monospace;}
  .chip .l{font-size:11.5px;color:var(--sub);line-height:1.25;}
  .chip .sw{width:11px;height:11px;border-radius:3px;}

  /* ── Section title ─────────────────────────────────────── */
  .sec{display:flex;align-items:center;gap:10px;margin:26px 2px 12px;}
  .sec h2{font-size:14px;margin:0;color:var(--sub);font-weight:600;letter-spacing:1.5px;}
  .sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}

  /* ── Grid & cards ──────────────────────────────────────── */
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));}
  .grid.cmd{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
  .card{
    position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,var(--panel),var(--bg2));box-shadow:var(--shadow);
    cursor:pointer;transition:transform .15s ease,border-color .15s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:#3a506180;}
  .card .bar{height:5px;width:100%;}
  .card .body{padding:14px 15px 13px;display:flex;gap:13px;align-items:flex-start;}
  .stage{
    position:relative;width:88px;height:88px;flex:none;border-radius:13px;
    background:radial-gradient(circle at 50% 120%, #ffffff10, transparent 60%), #0d141b;
    border:1px solid #ffffff10;display:grid;place-items:center;overflow:visible;
  }
  .stage canvas{image-rendering:pixelated;image-rendering:crisp-edges;}
  .info{min-width:0;flex:1;}
  .info .dept{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;margin-top:7px;
  }
  .task{font-size:12px;color:var(--sub);margin-top:9px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .pill{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:2px 7px;}
  .pill b{color:var(--text);font-weight:700;}

  /* character status ring on stage */
  .stage.s-active{box-shadow:0 0 0 2px #74c69d, 0 0 18px #74c69d55;}
  .stage.s-approval{box-shadow:0 0 0 2px var(--amber), 0 0 18px #f6c45355;}
  .stage.s-recent{box-shadow:0 0 0 2px #5aa9e6aa;}
  .stage.s-idle, .stage.s-empty{filter:saturate(.5);}
  .stage.s-watch{box-shadow:0 0 0 2px #f6c45388;}

  .bob{animation:bob .95s ease-in-out infinite alternate;}
  @keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-4px)}}
  .sway{animation:sway 2.6s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

  .ovl{position:absolute;font-size:15px;pointer-events:none;}
  .ovl.zzz{top:-4px;right:2px;color:#8ba0b4;animation:floatz 2.4s ease-in-out infinite;}
  @keyframes floatz{0%{opacity:.3;transform:translateY(2px)}50%{opacity:1}100%{opacity:.3;transform:translateY(-4px)}}
  .ovl.bang{top:-8px;right:6px;color:var(--amber);font-weight:900;animation:bang .8s ease-in-out infinite;}
  @keyframes bang{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.25) translateY(-3px)}}
  .ovl.spark{top:-2px;right:0;color:var(--green-l);animation:spark 1.4s linear infinite;}
  @keyframes spark{0%,100%{opacity:.4}50%{opacity:1}}

  /* ── Approvals action panel ────────────────────────────── */
  .todo{margin:18px 0 4px;border:1px solid #6b5413;border-left:6px solid var(--amber);border-radius:16px;
    background:linear-gradient(180deg,#241f12,#1a1810);box-shadow:var(--shadow);overflow:hidden;}
  .todo .th{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #3a3320;}
  .todo .th .ic{width:34px;height:34px;border-radius:9px;background:var(--amber);color:#3a2c00;
    display:grid;place-items:center;font-size:19px;font-weight:900;flex:none;}
  .todo .th h3{margin:0;font-size:16px;color:#ffe6a3;}
  .todo .th p{margin:2px 0 0;font-size:11.5px;color:#c8b27a;}
  .todo .th .cnt{margin-left:auto;font-family:"Consolas",monospace;font-size:13px;color:#ffe6a3;
    border:1px solid #6b5413;border-radius:20px;padding:4px 12px;font-weight:700;}
  .todo .items{padding:8px 12px 12px;}
  .todoitem{display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:11px;}
  .todoitem:nth-child(odd){background:#ffffff06;}
  .todoitem .dep{display:flex;align-items:center;gap:8px;width:184px;flex:none;font-size:12.5px;color:var(--text);}
  .todoitem .dep .dot{width:11px;height:11px;border-radius:3px;flex:none;}
  .todoitem .mid{flex:1;min-width:0;}
  .todoitem .ttl{font-size:14px;font-weight:700;color:#fff;line-height:1.35;}
  .todoitem .fmt{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;}
  .todoitem .tag{font-size:10px;color:#c8b27a;border:1px solid #6b5413;border-radius:6px;padding:1px 7px;text-transform:uppercase;}
  .todoitem .right{display:flex;align-items:center;gap:10px;flex:none;}
  .waitb{font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 11px;white-space:nowrap;}
  .open{font-size:12px;font-weight:700;text-decoration:none;border-radius:9px;padding:6px 13px;
    background:var(--amber);color:#3a2c00;white-space:nowrap;}
  .open:hover{filter:brightness(1.08);}
  .todo .guide{padding:10px 18px 16px;font-size:11.5px;color:#c8b27a;border-top:1px solid #3a3320;}
  .todo.clear{border-color:#2c4a38;border-left-color:var(--green-l);background:linear-gradient(180deg,#142019,#111a15);}
  .todo.clear .th .ic{background:var(--green-l);color:#06120b;}
  .todo.clear .th h3{color:#bdf0d4;} .todo.clear .th p{color:#8fbfa3;}

  /* ── Activity chart & timeline ─────────────────────────── */
  .panelbox{border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    background:linear-gradient(180deg,var(--panel),var(--bg2));box-shadow:var(--shadow);}
  .actrow{display:flex;align-items:center;gap:12px;padding:7px 0;}
  .actrow .nm{width:170px;flex:none;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .actrow .track{flex:1;height:16px;background:#0d141b;border-radius:8px;overflow:hidden;border:1px solid #ffffff0d;}
  .actrow .fill{height:100%;border-radius:8px;min-width:2px;transition:width .5s ease;}
  .actrow .val{width:104px;flex:none;text-align:right;font-size:11.5px;color:var(--sub);font-family:"Consolas",monospace;}
  .actrow .val b{color:var(--text);font-size:13px;}

  .tlrow{display:flex;align-items:center;gap:12px;padding:5px 0;}
  .tlrow .nm{width:170px;flex:none;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tlcells{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;}
  .tlcells .cell{width:12px;height:16px;border-radius:3px;flex:none;}
  .tlaxis{display:flex;justify-content:space-between;margin:8px 0 0 182px;font-size:10.5px;color:var(--dim);}
  .tllegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--sub);}
  .tllegend span{display:inline-flex;align-items:center;gap:6px;}
  .tllegend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .hint{font-size:11px;color:var(--dim);margin-top:10px;}

  /* ── 🏰 決裁の間 ランチャー ─────────────────────────────── */
  .castle{margin:16px 0 4px;border:1px solid #5a4a86;border-radius:16px;overflow:hidden;cursor:pointer;
    background:linear-gradient(135deg,#241b3a,#1a1530 60%,#15233a);box-shadow:var(--shadow);
    transition:transform .15s ease,border-color .15s ease;}
  .castle:hover{transform:translateY(-2px);border-color:#8a7ad0;}
  .castle .row1{display:flex;align-items:center;gap:16px;padding:16px 20px;}
  .castle .em{font-size:34px;filter:drop-shadow(0 2px 6px #0008);}
  .castle .ttl h3{margin:0;font-size:18px;color:#e9e4ff;}
  .castle .ttl p{margin:3px 0 0;font-size:12px;color:#a99fd6;}
  .castle .cta{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .castle .qn{font-family:"Consolas",monospace;font-size:13px;color:#ffe6a3;border:1px solid #6b5413;
    background:#2a210d;border-radius:20px;padding:5px 13px;font-weight:700;white-space:nowrap;}
  .castle .go{background:linear-gradient(135deg,#7c5cff,#5a3ff0);color:#fff;font-weight:800;font-size:14px;
    border:none;border-radius:11px;padding:11px 20px;white-space:nowrap;box-shadow:0 4px 14px #5a3ff066;}
  .kinghud{display:flex;align-items:center;gap:12px;padding:0 20px 14px;}
  .kinghud .lv{font-size:12px;color:#cdbef5;font-weight:700;white-space:nowrap;}
  .xpbar{flex:1;height:9px;background:#0e0a1c;border-radius:6px;overflow:hidden;border:1px solid #ffffff14;}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,#ffd34d,#ff8a3d);border-radius:6px;transition:width .6s ease;}
  .kinghud .xt{font-family:"Consolas",monospace;font-size:11px;color:#a99fd6;white-space:nowrap;}

  /* ── 🏰 決裁の間 オーバーレイ ───────────────────────────── */
  .throne-bg{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(1100px 700px at 50% -10%, #2a2150 0%, #120e22 55%, #08060f 100%);}
  .throne-bg.show{display:flex;}
  .throne-bg{overflow-y:auto;}
  .throne{width:min(720px,100%);max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:14px;padding-right:2px;}
  .throne::-webkit-scrollbar{width:9px;}
  .throne::-webkit-scrollbar-thumb{background:#463a6e;border-radius:6px;}
  .throne .thud{position:sticky;top:0;z-index:3;}

  /* HUD */
  .thud{display:flex;align-items:center;gap:14px;border:1px solid #463a6e;border-radius:16px;padding:12px 16px;
    background:linear-gradient(180deg,#1d1736,#15112a);}
  .thud .king{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center;
    border-radius:12px;background:radial-gradient(circle at 50% 130%, #ffd34d22, transparent 60%), #0d0a1a;border:1px solid #ffffff12;}
  .thud .king canvas{image-rendering:pixelated;}
  .thud .meta{flex:1;min-width:0;}
  .thud .title{font-size:15px;font-weight:800;color:#fff;}
  .thud .sub{font-size:11.5px;color:#a99fd6;margin-top:2px;}
  .thud .xpwrap{margin-top:7px;display:flex;align-items:center;gap:9px;}
  .thud .stat{text-align:center;flex:none;padding:0 4px;}
  .thud .stat b{display:block;font-family:"Consolas",monospace;font-size:20px;color:#ffe6a3;line-height:1;}
  .thud .stat span{font-size:10px;color:#a99fd6;}
  .thud .x{background:#0d0a1a;border:1px solid #463a6e;color:#a99fd6;width:34px;height:34px;border-radius:10px;
    font-size:17px;cursor:pointer;flex:none;}
  .thud .x:hover{color:#fff;}

  /* Stage */
  .tstage{position:relative;border:1px solid #463a6e;border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#171229 0%,#120e22 70%,#0d0a1a 100%);min-height:320px;
    display:flex;flex-direction:column;}
  .tscene{position:relative;height:150px;flex:none;overflow:hidden;
    background:repeating-linear-gradient(90deg,#1a1430 0 38px,#181229 38px 76px);
    border-bottom:2px solid #2a2147;}
  .tscene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,transparent,#0d0a1a);}
  .pawn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;}
  .pawn canvas{image-rendering:pixelated;}
  .pawn .scroll{font-size:24px;filter:drop-shadow(0 2px 4px #0008);animation:scrollbob 1.1s ease-in-out infinite alternate;}
  @keyframes scrollbob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
  .pawn.enter{animation:pawnIn .5s cubic-bezier(.2,.8,.2,1);}
  @keyframes pawnIn{from{transform:translateX(260px);opacity:0}to{transform:translateX(-50%);opacity:1}}
  .pawn.bowOK{animation:bowOut .55s ease forwards;}
  @keyframes bowOut{40%{transform:translate(-50%,6px) rotate(-3deg)}100%{transform:translate(-280px,0) rotate(0);opacity:0}}
  .pawn.bowNG{animation:bowBack .55s ease forwards;}
  @keyframes bowBack{100%{transform:translate(280px,0);opacity:0}}

  .tinfo{padding:16px 18px 4px;}
  .tinfo .dep{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cdbef5;}
  .tinfo .dep .dot{width:11px;height:11px;border-radius:3px;}
  .tinfo .qttl{font-size:19px;font-weight:800;color:#fff;margin-top:8px;line-height:1.35;}
  .tinfo .qmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;}
  .qtag{font-size:11px;color:#cdbef5;border:1px solid #463a6e;border-radius:7px;padding:2px 9px;background:#ffffff08;}
  .qstars{font-size:14px;letter-spacing:1px;}
  .qopen{font-size:12px;font-weight:700;text-decoration:none;border-radius:8px;padding:5px 12px;
    background:#2a2147;color:#cdbef5;border:1px solid #463a6e;}
  .qopen:hover{background:#34295a;color:#fff;}
  .qhint{font-size:11.5px;color:#8c80b8;padding:10px 18px 14px;}

  /* Action buttons */
  .tacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 18px 18px;}
  .tbtn{border:none;border-radius:13px;padding:15px 10px;cursor:pointer;font-weight:800;font-size:15px;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .1s ease,filter .1s ease;}
  .tbtn small{font-size:10px;font-weight:600;opacity:.85;}
  .tbtn:hover{transform:translateY(-2px);filter:brightness(1.08);}
  .tbtn:active{transform:translateY(0) scale(.97);}
  .tbtn.ok{background:linear-gradient(135deg,#2e9e6b,#1f7a52);box-shadow:0 5px 16px #2e9e6b55;}
  .tbtn.rev{background:linear-gradient(135deg,#d8a838,#b07f1f);box-shadow:0 5px 16px #d8a83855;color:#241c05;}
  .tbtn.ng{background:linear-gradient(135deg,#d05a5a,#a13c3c);box-shadow:0 5px 16px #d05a5a55;}
  .tskip{margin:0 18px 16px;text-align:center;}
  .tskip button{background:none;border:none;color:#8c80b8;font-size:12px;cursor:pointer;text-decoration:underline;}

  /* Stamp + popups */
  .stamp{position:absolute;top:42px;left:50%;transform:translate(-50%,-50%) rotate(-16deg) scale(.4);
    font-size:42px;font-weight:900;padding:6px 16px;border-radius:10px;border:4px solid;opacity:0;pointer-events:none;z-index:5;}
  .stamp.show{animation:stampIn .6s ease forwards;}
  @keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(1.8)}
    35%{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(.95)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(1)}}
  .stamp.ok{color:#5cf0a0;border-color:#5cf0a0;background:#0d2a1c99;}
  .stamp.rev{color:#ffd34d;border-color:#ffd34d;background:#2a230d99;}
  .stamp.ng{color:#ff8a8a;border-color:#ff8a8a;background:#2a0d0d99;}
  .xppop{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-family:"Consolas",monospace;
    font-weight:800;color:#ffe6a3;font-size:17px;opacity:0;pointer-events:none;z-index:6;}
  .xppop.show{animation:xpUp 1s ease forwards;}
  @keyframes xpUp{0%{opacity:0;transform:translate(-50%,4px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4;}
  .confetti i{position:absolute;top:-10px;width:7px;height:11px;border-radius:1px;opacity:.95;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(220px) rotate(360deg);opacity:0}}
  .levelup{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;}
  .levelup span{font-size:26px;font-weight:900;color:#ffe6a3;text-shadow:0 0 18px #ffb84d;opacity:0;}
  .levelup.show span{animation:lvpop 1.4s ease forwards;}
  @keyframes lvpop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

  /* Completion */
  .tdone{padding:34px 24px;text-align:center;}
  .tdone .big{font-size:44px;}
  .tdone h3{margin:10px 0 4px;font-size:22px;color:#fff;}
  .tdone p{margin:0;color:#a99fd6;font-size:13px;}
  .tdone .sums{display:flex;justify-content:center;gap:22px;margin:20px 0;}
  .tdone .sums div b{display:block;font-family:"Consolas",monospace;font-size:26px;color:#ffe6a3;}
  .tdone .sums div span{font-size:11px;color:#a99fd6;}
  .tdone .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .tdone .acts button{border:none;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:13px;}
  .tdone .copy{background:#2a2147;color:#cdbef5;border:1px solid #463a6e;}
  .tdone .done{background:linear-gradient(135deg,#7c5cff,#5a3ff0);color:#fff;}

  /* 修正依頼フォーム */
  .rform{padding:16px 18px 18px;}
  .rform h4{margin:0 0 4px;font-size:16px;color:#ffd9a0;}
  .rform .q{font-size:13px;color:#cdbef5;margin:0 0 12px;}
  .rform .lab{font-size:12px;color:#a99fd6;margin:12px 0 6px;font-weight:700;}
  .rchk{display:flex;flex-wrap:wrap;gap:7px;}
  .rchk label{font-size:12px;color:#e8e2ff;border:1px solid #463a6e;border-radius:9px;padding:7px 11px;cursor:pointer;
    background:#ffffff06;user-select:none;transition:background .1s,border-color .1s;}
  .rchk input{display:none;}
  .rchk input:checked + span{font-weight:700;}
  .rchk label:has(input:checked){background:#d8a83822;border-color:#d8a838;color:#ffe6a3;}
  .rform textarea{width:100%;box-sizing:border-box;margin-top:4px;background:#0e0a1c;border:1px solid #463a6e;
    border-radius:10px;color:#e8e2ff;font-size:13px;font-family:inherit;padding:10px 12px;resize:vertical;min-height:62px;}
  .rform textarea::placeholder{color:#6f6699;}
  .racts{display:flex;gap:10px;margin-top:16px;}
  .racts button{border:none;border-radius:11px;padding:13px 16px;font-weight:800;font-size:14px;cursor:pointer;}
  .racts .send{flex:1;background:linear-gradient(135deg,#d8a838,#b07f1f);color:#241c05;box-shadow:0 4px 14px #d8a83855;}
  .racts .cancel{background:#231d3a;color:#a99fd6;border:1px solid #463a6e;}
  .racts .send.ok2{background:linear-gradient(135deg,#2e9e6b,#1f7a52);color:#fff;box-shadow:0 4px 14px #2e9e6b55;}
  .catchips{display:flex;flex-wrap:wrap;gap:7px;}
  .catchip{font-size:12px;color:#cfe9da;border:1px solid #2c4a38;border-radius:9px;padding:7px 11px;cursor:pointer;
    background:#ffffff06;user-select:none;transition:background .1s,border-color .1s;}
  .catchip.sel{background:#2e9e6b26;border-color:#2e9e6b;color:#bff3d6;font-weight:700;}
  .sug{font-size:11px;color:#7fd6a8;margin-top:6px;}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:90;
    background:#1d1736;border:1px solid #5a4a86;color:#e8e2ff;padding:12px 20px;border-radius:12px;
    font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* ── Modal ─────────────────────────────────────────────── */
  .modal-bg{position:fixed;inset:0;background:#06090dcc;backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{width:min(540px,100%);max-height:88vh;overflow:auto;border-radius:18px;
    background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);box-shadow:var(--shadow);}
  .modal .mh{padding:20px 22px;display:flex;gap:16px;align-items:center;}
  .modal .mh .stage{width:96px;height:96px;}
  .modal .mh h3{margin:0;font-size:18px;}
  .modal .mh .mtask{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5;}
  .mbody{padding:4px 22px 22px;}
  .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13px;}
  .row .k{color:var(--sub);}
  .row .v{text-align:right;font-weight:600;}
  .lst{margin:6px 0 0;padding:0;list-style:none;}
  .lst li{font-size:12.5px;color:var(--text);padding:7px 11px;border:1px solid var(--line);
    border-radius:9px;margin-top:7px;display:flex;justify-content:space-between;gap:10px;background:#0d141b80;}
  .lst li .ago{color:var(--dim);font-size:11px;white-space:nowrap;}
  .empty{font-size:12px;color:var(--dim);padding:8px 0 2px;}
  .close{margin-left:auto;background:#0d141b;border:1px solid var(--line);color:var(--sub);
    width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;flex:none;}
  .close:hover{color:var(--text);}
  .seclabel{font-size:11px;letter-spacing:1px;color:var(--dim);margin:18px 0 2px;font-weight:700;}
  footer{margin-top:30px;text-align:center;font-size:11px;color:var(--dim);line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="logo">🌿</div>
      <div>
        <h1>CUE 稼働モニター <span style="font-size:11px;color:#8ba0b4;font-weight:400;border:1px solid #2a3a4a;padding:2px 7px;border-radius:8px;vertical-align:middle;">公開ビュー</span></h1>
        <p id="company">NPO法人 夢ノ森伴走者 CUE ／ AIマルチエージェント監視</p>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="clock">--:--:--</div>
      <div class="date" id="cdate">----年--月--日</div>
      <div class="live"><span class="dot"></span><span id="liveTxt">自動更新中</span></div>
    </div>
  </header>

  <div class="chips" id="chips"></div>

  <div id="throneLauncher"></div>

  <div id="approvalsPanel"></div>

  <div class="sec"><h2>司令塔</h2><div class="ln"></div></div>
  <div class="grid cmd" id="cmdGrid"></div>

  <div class="sec"><h2>各部署の稼働状況（8部門）</h2><div class="ln"></div></div>
  <div class="grid" id="deptGrid"></div>

  <div class="sec"><h2>活動量（過去7日間の更新ファイル数）</h2><div class="ln"></div></div>
  <div class="panelbox" id="actChart"></div>

  <div class="sec"><h2>稼働タイムライン（状態の移り変わり）</h2><div class="ln"></div></div>
  <div class="panelbox" id="timeline"></div>

  <footer>
    最終更新: <span id="updated">—</span> ／ このPCが稼働している間、自動で更新されます（数十秒ごと）<br>公開版は<b>状態と活動量のみ</b>を表示しています（ファイル名・企画名などの内部情報は含みません）。
  </footer>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<!-- 🏰 決裁の間（Throne Room） -->
<div class="throne-bg" id="throneBg">
  <div class="throne" id="throneRoom"></div>
</div>

<script>
/* ===========================================================================
 *  ドット絵キャラクター描画
 * ======================================================================== */
// 16x16 ベーススプライト（H=髪/帽子, S=肌, E=目, o=口, B=服, .=透明）
const SPRITE = [
  "................",
  "....HHHHHH......",
  "..HHHHHHHHHH....",
  "..HSSSSSSSSH....",
  "..HSSSSSSSSH....",
  "..HSEESSEESH....",
  "..HSSSSSSSSH....",
  "..HSSooooSSH....",
  "...SSSSSSSS.....",
  "...BBBBBBBB.....",
  "..BBBBBBBBBB....",
  "..BBBAABABBB....",
  "..SBBBBBBBBS....",
  "...BBBBBBBB.....",
  "...BB....BB.....",
  "...BB....BB.....",
];

function shade(hex, f){ // f<1 暗く / f>1 明るく
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.min(255,Math.round(r*f));g=Math.min(255,Math.round(g*f));b=Math.min(255,Math.round(b*f));
  return `rgb(${r},${g},${b})`;
}

function drawChar(canvas, cfg, pxArg){
  const grid = SPRITE.map(r => (r+"................").slice(0,16));
  const px = pxArg || 5;              // 1ドット=px
  const N = 16, dpr = window.devicePixelRatio||1;
  canvas.width = N*px*dpr; canvas.height = N*px*dpr;
  canvas.style.width = (N*px)+'px'; canvas.style.height=(N*px)+'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.imageSmoothingEnabled=false;
  const pal = {
    H: cfg.color, S:'#f3c9a0', E:'#22303c', o:'#c77b62',
    B: cfg.light, A: shade(cfg.color,0.7),
  };
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const c = grid[y][x]; if(c==='.') continue;
    ctx.fillStyle = pal[c] || '#000';
    ctx.fillRect(x*px, y*px, px, px);
  }
  // 王冠（代表）
  if(cfg.crown){
    ctx.fillStyle = '#ffd34d';
    [[5,0],[7,0],[9,0],[5,1],[6,1],[7,1],[8,1],[9,1]].forEach(([x,y])=>ctx.fillRect(x*px,y*px,px,px));
    ctx.fillStyle='#fff3b0'; ctx.fillRect(7*px,0,px,px);
  }
  // クリップボード（部長）
  if(cfg.clipboard){
    ctx.fillStyle='#f2f3f5'; ctx.fillRect(11*px,10*px,4*px,5*px);
    ctx.fillStyle='#9aa7b2'; ctx.fillRect(11*px,10*px,4*px,px);
    ctx.fillStyle='#5d7185'; for(let i=0;i<3;i++) ctx.fillRect(12*px,(11+i)*px,2*px,1);
  }
}

/* ===========================================================================
 *  状態に応じた見た目
 * ======================================================================== */
const STATE = {
  active:   {label:'稼働中',   col:'#74c69d', anim:'bob',  ovl:'spark', sym:'✦'},
  approval: {label:'承認待ち', col:'#f6c453', anim:'bob',  ovl:'bang',  sym:'❗'},
  recent:   {label:'最近活動', col:'#5aa9e6', anim:'sway', ovl:'',      sym:''},
  idle:     {label:'待機中',   col:'#7b8ea0', anim:'',     ovl:'zzz',   sym:'💤'},
  empty:    {label:'未着手',   col:'#5d7185', anim:'',     ovl:'zzz',   sym:'💤'},
  watch:    {label:'見守り中', col:'#f6c453', anim:'sway', ovl:'',      sym:''},
};

function stage(cfg){
  const st = STATE[cfg.state] || STATE.idle;
  const wrap = document.createElement('div');
  wrap.className = 'stage s-'+cfg.state;
  const cv = document.createElement('canvas');
  if(st.anim) cv.className = st.anim;
  wrap.appendChild(cv);
  drawChar(cv, cfg);
  if(st.ovl && st.sym){
    const o=document.createElement('div'); o.className='ovl '+st.ovl; o.textContent=st.sym;
    wrap.appendChild(o);
  }
  return wrap;
}

function badge(cfg){
  const st = STATE[cfg.state]||STATE.idle;
  const b=document.createElement('span'); b.className='badge';
  b.style.background = st.col+'22'; b.style.color = st.col; b.style.border='1px solid '+st.col+'55';
  b.textContent = '● '+ (cfg.stateLabel || st.label);
  return b;
}

/* ===========================================================================
 *  カード生成
 * ======================================================================== */
function card(cfg, isCmd){
  const c=document.createElement('div'); c.className='card';
  const bar=document.createElement('div'); bar.className='bar';
  bar.style.background = `linear-gradient(90deg, ${cfg.color}, ${cfg.light})`;
  c.appendChild(bar);

  const body=document.createElement('div'); body.className='body';
  body.appendChild(stage(cfg));

  const info=document.createElement('div'); info.className='info';
  const dept=document.createElement('div'); dept.className='dept';
  dept.innerHTML = `<span>${cfg.emoji||''}</span><span>${cfg.name}</span>`;
  info.appendChild(dept);
  info.appendChild(badge(cfg));
  const task=document.createElement('div'); task.className='task'; task.textContent=cfg.task||'';
  info.appendChild(task);

  if(!isCmd){
    const meta=document.createElement('div'); meta.className='meta';
    const pjN = (cfg.projectsCount!=null)?cfg.projectsCount:(cfg.projects||[]).length;
    const apN = (cfg.approvalsCount!=null)?cfg.approvalsCount:(cfg.approvals||[]).length;
    meta.innerHTML =
      `<span class="pill">PJ <b>${pjN}</b></span>`+
      `<span class="pill">承認待 <b>${apN}</b></span>`+
      `<span class="pill">ファイル <b>${cfg.fileCount||0}</b></span>`;
    info.appendChild(meta);
  }
  body.appendChild(info);
  c.appendChild(body);
  c.onclick=()=>openModal(cfg);
  return c;
}

/* ===========================================================================
 *  モーダル
 * ======================================================================== */
function listBlock(title, items){
  let html = `<div class="seclabel">${title}（${items.length}）</div>`;
  if(!items.length){ return html + `<div class="empty">なし</div>`; }
  html += '<ul class="lst">';
  for(const it of items){
    if(typeof it === 'string') html += `<li><span>${it}</span></li>`;
    else html += `<li><span>${it.name}</span><span class="ago">${it.ago||''}</span></li>`;
  }
  return html + '</ul>';
}

function openModal(cfg){
  const m=document.getElementById('modal');
  const st=STATE[cfg.state]||STATE.idle;
  m.innerHTML='';
  const mh=document.createElement('div'); mh.className='mh';
  mh.appendChild(stage(cfg));
  const tt=document.createElement('div');
  tt.innerHTML = `<h3>${cfg.emoji||''} ${cfg.name}</h3>`;
  const bd=badge(cfg); tt.appendChild(bd);
  const mt=document.createElement('div'); mt.className='mtask'; mt.textContent=cfg.task||'';
  tt.appendChild(mt);
  mh.appendChild(tt);
  const x=document.createElement('button'); x.className='close'; x.textContent='✕';
  x.onclick=(e)=>{e.stopPropagation();closeModal();};
  mh.appendChild(x);
  m.appendChild(mh);

  const body=document.createElement('div'); body.className='mbody';
  let rows='';
  if(cfg.lastFile!==undefined)
    rows += `<div class="row"><span class="k">最終更新ファイル</span><span class="v">${cfg.lastFile||'—'}</span></div>`;
  if(cfg.ago!==undefined)
    rows += `<div class="row"><span class="k">最終活動</span><span class="v">${cfg.ago||'—'}</span></div>`;
  if(cfg.today!==undefined)
    rows += `<div class="row"><span class="k">本日の更新</span><span class="v">${cfg.today||0} 件</span></div>`;
  if(cfg.week!==undefined)
    rows += `<div class="row"><span class="k">今週の更新（7日）</span><span class="v">${cfg.week||0} 件</span></div>`;
  if(cfg.fileCount!==undefined)
    rows += `<div class="row"><span class="k">保有ファイル数</span><span class="v">${cfg.fileCount||0} 件</span></div>`;
  body.innerHTML = rows;

  if(cfg.subUnits){
    body.innerHTML += listBlock('担当ユニット',
      cfg.subUnits.map(u=>({name:u.name, ago: u.minAgo===null?'記録なし':agoText(u.minAgo)})));
  }
  // 進行中プロジェクト：詳細（名称）があればリスト、公開版は件数のみ
  if(Array.isArray(cfg.projects)) body.innerHTML += listBlock('進行中プロジェクト', cfg.projects);
  else if(cfg.projectsCount!=null) body.innerHTML += `<div class="row"><span class="k">進行中プロジェクト</span><span class="v">${cfg.projectsCount} 件</span></div>`;
  if(Array.isArray(cfg.approvals)) body.innerHTML += listBlock('承認待ちの提出物', cfg.approvals);
  else if(cfg.approvalsCount!=null) body.innerHTML += `<div class="row"><span class="k">承認待ちの提出物</span><span class="v">${cfg.approvalsCount} 件</span></div>`;
  m.appendChild(body);

  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').onclick=(e)=>{ if(e.target.id==='modalBg') closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function agoText(min){
  if(min<1)return'たった今'; if(min<60)return min+'分前';
  if(min<1440)return Math.floor(min/60)+'時間前'; return Math.floor(min/1440)+'日前';
}

/* ===========================================================================
 *  描画 & データ読み込み
 * ======================================================================== */
function render(d){
  if(!d) return;
  document.getElementById('company').textContent = d.company + ' ／ AIマルチエージェント監視';

  const s=d.summary||{};
  const chips=[
    {n:s.active||0,  l:'稼働中',      sw:'#74c69d'},
    {n:s.recent||0,  l:'最近活動',    sw:'#5aa9e6'},
    {n:s.idle||0,    l:'待機・未着手', sw:'#7b8ea0'},
    {n:s.approval||0,l:'承認待ち',    sw:'#f6c453'},
    {n:s.projects||0,l:'進行中PJ',    sw:'#b388ff'},
    {n:s.todayTotal||0,l:'本日の更新', sw:'#ff8a65'},
  ];
  document.getElementById('chips').innerHTML = chips.map(c=>
    `<div class="chip"><span class="sw" style="background:${c.sw}"></span>`+
    `<span class="n">${c.n}</span><span class="l">${c.l}</span></div>`).join('');

  renderApprovals(d);
  renderThroneLauncher(d);

  const cmd=document.getElementById('cmdGrid'); cmd.innerHTML='';
  if(d.rep)  cmd.appendChild(card(d.rep,true));
  if(d.head) cmd.appendChild(card(d.head,true));

  const g=document.getElementById('deptGrid'); g.innerHTML='';
  (d.depts||[]).forEach(dep=> g.appendChild(card(dep,false)));

  renderChart(d);
  renderTimeline(d);

  const up=d.generatedAt? new Date(d.generatedAt):null;
  document.getElementById('updated').textContent = up? up.toLocaleString('ja-JP'):'—';
}

/* ✅ あなたの対応待ち（承認すべき決裁）— ローカル画面のみ */
function waitBadge(min){
  const days=Math.floor(min/1440);
  let col,bg,txt;
  if(min>=7*1440){ col='#ff6b6b';bg='#ff6b6b22';txt=days+'日待ち'; }
  else if(min>=2*1440){ col='#f6c453';bg='#f6c45322';txt=days+'日待ち'; }
  else { col='#8ba0b4';bg='#8ba0b422';txt=(min<60?'今日':((days||Math.floor(min/60)+'時間')+(days?'日':'')))+'待ち'; }
  return `<span class="waitb" style="color:${col};background:${bg};border:1px solid ${col}55">${txt}</span>`;
}
function renderApprovals(d){
  const el=document.getElementById('approvalsPanel'); if(!el) return;
  const list=d.pendingApprovals;

  // 公開ビュー（pendingApprovals なし）では、件数だけ静かに案内
  if(!Array.isArray(list)){
    const n=(d.summary&&d.summary.approval)||0;
    el.innerHTML = n>0
      ? `<div class="todo"><div class="th"><div class="ic">!</div><div><h3>承認待ち ${n}件</h3>`+
        `<p>代表の対応待ちがあります（内部の詳細はローカル画面でのみ表示されます）</p></div>`+
        `<span class="cnt">${n}</span></div></div>`
      : '';
    return;
  }

  if(!list.length){
    el.innerHTML = `<div class="todo clear"><div class="th"><div class="ic">✓</div>`+
      `<div><h3>対応待ちはありません</h3><p>承認待ちの決裁はすべて処理済みです。</p></div></div></div>`;
    return;
  }

  const rows = list.map(a=>{
    const opens = (a.files||[]).map(f=>`<a class="open" href="${f.url}" target="_blank" rel="noopener">${(f.ext||'file').toUpperCase()}を開く</a>`).join('');
    const tags  = (a.formats||[]).map(x=>`<span class="tag">${x}</span>`).join('');
    return `<div class="todoitem">`+
      `<span class="dep"><span class="dot" style="background:${a.color}"></span>${a.emoji||''} ${a.deptName}</span>`+
      `<span class="mid"><div class="ttl">${a.title}</div><div class="fmt">${tags}</div></span>`+
      `<span class="right">${waitBadge(a.minAgo)}${opens}</span>`+
    `</div>`;
  }).join('');

  el.innerHTML = `<div class="todo">`+
    `<div class="th"><div class="ic">!</div>`+
    `<div><h3>あなたが対応する承認待ち（古い順）</h3>`+
    `<p>確認のうえ、approvals/ に判断を記録し、完了したら archived/ へ移動してください。</p></div>`+
    `<span class="cnt">${list.length}件</span></div>`+
    `<div class="items">${rows}</div>`+
    `<div class="guide">💡 「◯◯を開く」で提出物を直接開けます（このPC上のファイル）。色：`+
    `<span style="color:#8ba0b4">グレー=新しい</span> ／ <span style="color:#f6c453">黄=2日以上</span> ／ <span style="color:#ff6b6b">赤=7日以上（早めの対応を）</span></div>`+
  `</div>`;
}

/* ===========================================================================
 *  🏰 決裁の間（Throne Room）— 確認業務をRPG的に楽しくする
 * ======================================================================== */
const KING_TITLES = ['見習いの王','見守りの王','里山の王','百年の王','伝説の王','神話の王'];
const KING_KEY='cueKing_v1';
function kingLoad(){
  let s; try{ s=JSON.parse(localStorage.getItem(KING_KEY)); }catch{ s=null; }
  if(!s) s={ xp:0, decisions:{}, log:[], lastDate:null, streak:0, todayCount:0 };
  // 日付が変わったら本日カウントとstreak更新
  const today=new Date().toLocaleDateString('ja-JP');
  if(s.lastDate!==today){
    const y=new Date(Date.now()-86400000).toLocaleDateString('ja-JP');
    s.streak = (s.lastDate===y) ? (s.streak||0)+1 : 1;
    s.lastDate=today; s.todayCount=0;
  }
  return s;
}
function kingSave(s){ try{ localStorage.setItem(KING_KEY, JSON.stringify(s)); }catch{} }
function kingLevel(xp){ return Math.floor(xp/100)+1; }
function kingTitle(xp){ return KING_TITLES[Math.min(KING_TITLES.length-1, kingLevel(xp)-1)]; }

let THRONE = { queue:[], idx:0, lastDecideAt:0, combo:0 };

function renderThroneLauncher(d){
  const el=document.getElementById('throneLauncher'); if(!el) return;
  const q=Array.isArray(d.reviewQueue)?d.reviewQueue:null;
  if(!q){ el.innerHTML=''; return; }                 // 公開ビューでは非表示
  const s=kingLoad();
  const pending=q.filter(x=>!s.decisions[x.id]).length;
  const xp=s.xp||0, lvl=kingLevel(xp), pct=xp%100;
  el.innerHTML =
    `<div class="castle" onclick="openThrone()">`+
      `<div class="row1">`+
        `<div class="em">🏰</div>`+
        `<div class="ttl"><h3>決裁の間</h3><p>成果物を一件ずつ確認して、承認・修正・却下を決めましょう</p></div>`+
        `<div class="cta">`+
          `<span class="qn">謁見待ち ${pending}件</span>`+
          `<button class="go">▶ 謁見を始める</button>`+
        `</div>`+
      `</div>`+
      `<div class="kinghud"><span class="lv">👑 Lv.${lvl}　${kingTitle(xp)}</span>`+
        `<span class="xpbar"><i style="width:${pct}%"></i></span>`+

const KING_LINES={
  approve:['「うむ、見事である」','「これでよい。進めよ」','「よき仕事だ」','「承認する。次へ」'],
  revise:['「惜しい。ここを直すのだ」','「もう一歩、磨こう」','「方向はよい。修正を」'],
  reject:['「今回は見送ろう」','「時を改めよう」','「縁がなかった。次だ」'],
};
function confettiBurst(){
  const c=document.getElementById('confetti'); if(!c) return;
  const cols=['#ffd34d','#5cf0a0','#7c5cff','#5aa9e6','#ff8a8a','#ffffff'];
  for(let i=0;i<26;i++){ const s=document.createElement('i');
    s.style.left=(10+Math.random()*80)+'%'; s.style.background=cols[i%cols.length];
    s.style.animationDuration=(0.7+Math.random()*0.8)+'s'; s.style.animationDelay=(Math.random()*0.15)+'s';
    c.appendChild(s); setTimeout(()=>s.remove(),1700); }
}
function decide(kind, payload){
  const q=THRONE.queue[THRONE.idx]; if(!q) return;
  // 「修正」は、まず“どこを直すか”を入力 → cordX(Codex/Claude Code)へ送る
  if(kind==='revise' && !payload){ openReviseForm(q); return; }
  // 「承認」は、まず分類を確認 → 種類別フォルダへ移動
  if(kind==='approve' && !payload){ openApproveForm(q); return; }
  const s=kingLoad();
  // XP計算
  let gain = kind==='approve'?12 : kind==='revise'?8 : 8;
  if(q.importance==='高') gain+=5; else if(q.importance==='中') gain+=2;
  const now=Date.now(); const fast=(now-THRONE.lastDecideAt)<8000 && THRONE.lastDecideAt>0;
  THRONE.combo = fast ? THRONE.combo+1 : 0; THRONE.lastDecideAt=now;
  const combo = THRONE.combo>0 ? Math.min(THRONE.combo*2,10) : 0;
  gain += combo;
  const beforeLv=kingLevel(s.xp||0);
  s.xp=(s.xp||0)+gain; s.todayCount=(s.todayCount||0)+1;
  s.decisions[q.id]=kind;
  s.log=s.log||[]; s.log.push({id:q.id,title:q.title,dept:q.deptName,type:q.type,decision:kind,at:new Date().toISOString(),note:payload?payload.summary:'',category:payload?payload.category||'':'',paths:(q.files||[]).map(f=>relPath(f.url))});
  if(s.log.length>500) s.log=s.log.slice(-500);
  if(payload && payload.moved && payload.moved.length){ s.moves=s.moves||[]; s.moves.push(...payload.moved.map(m=>({...m,at:new Date().toISOString()}))); if(s.moves.length>1000) s.moves=s.moves.slice(-1000); }
  kingSave(s);

  // 演出
  const map={approve:{cls:'ok',txt:'承認'},revise:{cls:'rev',txt:'修正'},reject:{cls:'ng',txt:'却下'}};
  const m=map[kind];
  const stamp=document.getElementById('stamp');
  if(stamp){ stamp.className='stamp '+m.cls; stamp.textContent=m.txt; void stamp.offsetWidth; stamp.classList.add('show'); }
  const pop=document.getElementById('xppop');
  if(pop){ pop.textContent='+'+gain+' XP'+(combo?`　COMBO×${THRONE.combo}!`:''); pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show'); }
  if(kind==='approve') confettiBurst();
  const pawn=document.getElementById('pawn');
  if(pawn) pawn.classList.add(kind==='reject'?'bowNG':'bowOK');
  // HUD更新
  const hx=document.getElementById('hudXp'), ht=document.getElementById('hudXt'), td=document.getElementById('stTodp');
  if(hx) hx.style.width=((s.xp%100))+'%'; if(ht) ht.textContent=`XP ${s.xp%100}/100`; if(td) td.textContent=s.todayCount;
  // レベルアップ
  if(kingLevel(s.xp)>beforeLv){
    const lu=document.getElementById('levelup');
    if(lu){ lu.querySelector('span').textContent=`🎉 LEVEL UP! Lv.${kingLevel(s.xp)} ${kingTitle(s.xp)}`; lu.classList.add('show'); setTimeout(()=>lu.classList.remove('show'),1500); }
  }
  // 次へ
  setTimeout(()=>{ THRONE.idx++; drawThrone(); }, 720);
}
function skipQuest(){
  const q=THRONE.queue.splice(THRONE.idx,1)[0];
  if(q) THRONE.queue.push(q);
  drawThrone();
}

    `</div></div>`;
  document.getElementById('kingChar')?.appendChild(kingCanvas({color:'#b7791f',light:'#f6c453',crown:true},4));

function buildReviseMd(q,reasons,note,expect){
  const files=(q.files||[]).map(f=>`${(f.ext||'').toUpperCase()}: ${f.url}`).join('\n  ');
  return `# 修正依頼：${q.title}\n\n`+
    `- 部署：${q.deptName}\n- 種類：${q.type} ／ 重要度：${q.importance}\n`+
    `- 元成果物：${q.rawName}\n- ファイル：\n  ${files||'（不明）'}\n- 依頼日時：${new Date().toLocaleString('ja-JP')}\n\n`+
    `## 直してほしい点\n`+ (reasons.length?reasons.map(r=>`- ${r}`).join('\n'):'- （チェックなし）') +
    (note?`\n- ${note}`:'') + `\n\n`+
    `## 期待する状態\n${expect||'（指定なし）'}\n\n`+
    `---\nこの修正依頼は CUE「決裁の間」から自動生成されました。\n`+
    `担当エージェント（Codex / Claude Code）は、上記ファイルを開いて修正し、完了後この依頼を done/ へ移してください。\n`;
}
function toast(msg){
  let t=document.getElementById('cueToast');
  if(!t){ t=document.createElement('div'); t.id='cueToast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600);
}
function submitRevise(){
  const q=THRONE.queue[THRONE.idx]; if(!q) return;
  const reasons=[...document.querySelectorAll('.rchk input:checked')].map(i=>i.value);
  const note=(document.getElementById('rvNote')?.value||'').trim();
  const expect=(document.getElementById('rvExpect')?.value||'').trim();
  const md=buildReviseMd(q,reasons,note,expect);
  const summary=[...reasons, note].filter(Boolean).join(' / ').slice(0,120);
  const hint=`${q.deptId}_${q.rawName}`;
  // ① ブリッジへ送信（Codex/Claude Code 用フォルダに書き出し）
  fetch('/api/revise',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({filenameHint:hint,content:md,metadata:{
      deptId:q.deptId,deptName:q.deptName,title:q.title,rawName:q.rawName,type:q.type,importance:q.importance,
      files:q.files||[],reasons,note,expect
    }})})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(j=>{ toast('📨 修正依頼を送信しました（'+(j.file||'修正依頼/')+'）'); })
    .catch(()=>{ // ② フォールバック：ダウンロード保存＋コピー
      try{ const b=new Blob([md],{type:'text/markdown'}); const a=document.createElement('a');
        a.href=URL.createObjectURL(b); a.download=hint+'.md'; a.click(); }catch(e){}
      if(navigator.clipboard) navigator.clipboard.writeText(md).catch(()=>{});
      toast('💾 ブリッジ未起動のため、修正依頼を保存しました（修正依頼/ に置いてください）');
    });
  // 記録＋演出＋次へ
  drawThrone();
  decide('revise',{summary});
}

function buildAgentPrompt(today){
  const ap=today.filter(l=>l.decision==='approve');

  let p='';

  p+=`代表が「決裁の間」で ${date} に下した判断を、以下のとおり反映してください。\n\n`;
  p+=`## 共通ルール\n`;
  p+=`- 方針は 01_代表室/ナレッジ/会社の方針.md と 01_代表室/ナレッジ/CUE再利用ライブラリ.md を必ず参照する\n`;
  p+=`- 金額・契約・外部発信・方針変更は勝手に確定せず、変更案＋「代表承認待ち」と明記する\n`;

  p+=`- 認定NPO法人は目指さない方針（税制優遇・認定を前面に出さない）\n\n`;

  p+=`## ① 修正（${rv.length}件）— 直してください\n`;
  if(rv.length){
    p+=`各成果物を下記の指示どおり修正してください。詳細な修正依頼は \`shared-workspace/修正依頼/\` の .md にもあります。\n`;
    p+=`完了したら、その依頼ファイルを \`shared-workspace/修正依頼/done/\`（無ければ作成）へ移動してください。\n\n`;
    rv.forEach((l,i)=>{
      p+=`### ${i+1}. [${l.dept}] ${l.title}\n`;
      p+=`- 直す点: ${l.note||'（修正依頼ファイル参照）'}\n`;
      if(l.paths&&l.paths.length) p+=`- 対象ファイル:\n${l.paths.map(x=>`  - ${x}`).join('\n')}\n`;
      p+=`\n`;
    });
  } else { p+=`（なし）\n\n`; }

  p+=`## ② 承認（${ap.length}件）— 対応不要（記録のみ）\n`;
  if(ap.length){
    p+=`以下は承認され、種類別フォルダへ移動済みです。再編集は不要です。\n`;
    ap.forEach(l=>{ p+=`- [${l.dept}] ${l.title}${l.category?` → 承認済みライブラリ/${l.category}/`:''}\n`; });
    p+=`\n`;
  } else { p+=`（なし）\n\n`; }

  p+=`## ③ 却下（${ng.length}件）— 保留（作業しない）\n`;
  if(ng.length){ ng.forEach(l=>{ p+=`- [${l.dept}] ${l.title}\n`; }); p+=`\n`; }
  else { p+=`（なし）\n\n`; }

  p+=`---\n以上を実行し、変更したファイルと未確定（代表承認待ち）の点を簡潔に報告してください。\n`;
  return p;
}

function buildLatestAgentPrompt(logs){
  const latest=(logs||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at))[0];
  const decisionJa={approve:'承認',revise:'修正',reject:'却下'}[latest&&latest.decision] || '未記録';
  const at=latest&&latest.at ? new Date(latest.at).toLocaleString('ja-JP') : '未記録';
  if(!latest){
    return '# CUE 謁見ログ反映プロンプト（Codex / Claude Code 用）\n\n謁見ログがまだありません。\n';
  }

  let p='';
  p+=`# CUE 謁見ログ反映プロンプト（Codex / Claude Code 用）\n\n`;
  p+=`作業フォルダ:\nC:\\Users\\User\\Desktop\\AI会社\n\n`;
  p+=`あなたは CUE の成果物を編集・整理するエージェントです。\n`;
  p+=`以下の謁見ログを読み、必要なファイル編集・移動・報告を行ってください。\n\n`;
  p+=`## 謁見結果\n`;
  p+=`- 日時: ${at}\n`;
  p+=`- 部署: ${latest.dept||'未記録'}\n`;
  p+=`- 成果物: ${latest.title||'未記録'}\n`;
  p+=`- 種別: ${latest.type||'未記録'}\n`;
  p+=`- 判断: ${decisionJa}\n`;
  p+=`- 代表メモ: ${latest.note||'（なし）'}\n`;
  if(latest.category) p+=`- 承認カテゴリ: ${latest.category}\n`;
  p+=`- 対象ファイル:\n`;
  if(latest.paths&&latest.paths.length){
    p+=latest.paths.map(x=>`  - ${x}`).join('\n')+`\n`;
  } else {
    p+=`  - （記録なし）\n`;
  }
  p+=`\n`;

  p+=`## 実行ルール\n`;
  p+=`- 方針は 01_代表室/ナレッジ/会社の方針.md と 01_代表室/ナレッジ/CUE再利用ライブラリ.md を必ず参照する\n`;
  p+=`- 修正の場合は対象ファイルを編集し、必要なら shared-workspace/修正依頼/ の依頼内容も確認する\n`;
  p+=`- 承認の場合は原則再編集せず、記録として扱う\n`;
  p+=`- 却下の場合は作業しない\n`;
  p+=`- 金額・契約・外部発信・方針変更は勝手に確定せず、変更案＋「代表承認待ち」と明記する\n`;
  p+=`- 個人情報・肖像権・安全（セーフガーディング）に配慮する\n`;
  p+=`- 変更したファイルと、代表承認待ちの点を最後に報告してください\n`;
  return p;
}

function copyText(txt, btn, label){
  const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent=label; setTimeout(()=>btn.textContent=o,1800);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(done); }
  else {
    try{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }catch(e){}
    done();
  }
}

function copyLatestDecision(btn){
  const s=kingLoad();
  copyText(buildLatestAgentPrompt(s.log||[]), btn, '✓ 最後の謁見ログをコピーしました');
}

function copyDecisions(btn){
  const s=kingLoad();
  const today=s.log.filter(l=>new Date(l.at).toLocaleDateString('ja-JP')===new Date().toLocaleDateString('ja-JP'));
  const txt=buildAgentPrompt(today);
  copyText(txt, btn, '✓ プロンプトをコピーしました');
}

/* 活動量バー（過去7日の更新ファイル数） */
function renderChart(d){
  const el=document.getElementById('actChart'); if(!el) return;
  const deps=d.depts||[];
  const max=Math.max(1, ...deps.map(x=>x.week||0));
  el.innerHTML = deps.map(x=>{
    const w=Math.round((x.week||0)/max*100);
    return `<div class="actrow">`+
      `<span class="nm">${x.emoji||''} ${x.name}</span>`+
      `<span class="track"><span class="fill" style="width:${w}%;background:linear-gradient(90deg,${x.color},${x.light})"></span></span>`+
      `<span class="val"><b>${x.week||0}</b> 件 <span style="color:var(--dim)">/ 本日 ${x.today||0}</span></span>`+
    `</div>`;
  }).join('') || '<div class="hint">データがありません。</div>';
}

/* 稼働タイムライン（履歴スナップショットを状態色のセルで表示） */
function renderTimeline(d){
  const el=document.getElementById('timeline'); if(!el) return;
  const hist=d.history||[];
  const order=d.deptOrder||(d.depts||[]).map(x=>({id:x.id,name:x.name}));
  const COL={active:'#74c69d',approval:'#f6c453',recent:'#5aa9e6',idle:'#46566a',empty:'#33414f',watch:'#f6c453'};
  if(!hist.length){ el.innerHTML='<div class="hint">まだ履歴がありません。監視ループを動かすと、ここに状態の移り変わりが溜まっていきます。</div>'; return; }

  let html='';
  order.forEach((dep,di)=>{
    const cells=hist.map(h=>{
      const stt=(h.states&&h.states[di])||'idle';
      const tm=new Date(h.t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      return `<span class="cell" title="${dep.name}｜${tm}｜${stateJa(stt)}" style="background:${COL[stt]||'#46566a'}"></span>`;
    }).join('');
    const cur=(d.depts||[]).find(x=>x.id===dep.id);
    html+=`<div class="tlrow"><span class="nm">${(cur&&cur.emoji)||''} ${dep.name}</span><span class="tlcells">${cells}</span></div>`;
  });

  const t0=new Date(hist[0].t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const t1=new Date(hist[hist.length-1].t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  html+=`<div class="tlaxis"><span>${t0}</span><span>← 古い　／　新しい →</span><span>${t1}</span></div>`;
  html+=`<div class="tllegend">`+
    `<span><i style="background:#74c69d"></i>稼働中</span>`+
    `<span><i style="background:#5aa9e6"></i>最近活動</span>`+
    `<span><i style="background:#f6c453"></i>承認待ち</span>`+
    `<span><i style="background:#46566a"></i>待機・未着手</span>`+
  `</div>`;
  el.innerHTML=html;
}
function stateJa(s){return({active:'稼働中',approval:'承認待ち',recent:'最近活動',idle:'待機中',empty:'未着手',watch:'見守り中'})[s]||s;}

async function loadStatus(){
  // ① http で配信されている場合は JSON を取得（ライブ更新向き）
  try{
    const r=await fetch('cue-status.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){ const j=await r.json(); window.CUE_STATUS=j; return j; }
  }catch(e){/* file:// では失敗 → ②へ */}
  // ② cue-status.js を読み直す（ファイルを直接開いた場合）
  await new Promise(res=>{
    const sc=document.createElement('script');
    sc.src='cue-status.js?t='+Date.now();
    sc.onload=()=>res(); sc.onerror=()=>res();
    document.body.appendChild(sc);
    setTimeout(()=>{ try{sc.remove();}catch(_){} }, 1500);
  });
  return window.CUE_STATUS||null;
}

async function refresh(){
  const d=await loadStatus();
  render(d || window.CUE_STATUS);
}

/* 時計 */
function tick(){
  const n=new Date(); const z=x=>String(x).padStart(2,'0');
  document.getElementById('clock').textContent=`${z(n.getHours())}:${z(n.getMinutes())}:${z(n.getSeconds())}`;
  const w=['日','月','火','水','木','金','土'][n.getDay()];
  document.getElementById('cdate').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日（${w}）`;
}

/* 起動 */
render(window.CUE_STATUS);     // 初期表示（静的読み込みがあれば即表示）
refresh();                     // 読み込み直後に最新データを取得（公開版=fetch）
tick(); setInterval(tick,1000);
setInterval(refresh,8000);     // 8秒ごとに状態を読み直す（ブリッジの自動監視と連動）
</script>
